# Reusable CI for Nx + npm repositories (architecture §15.6).
# Pull requests run only the projects they touch (`nx affected`); pushes to
# main and manual runs check every project, so main is always fully verified.
name: node-ci

on:
  workflow_call:
    inputs:
      node-version-file:
        description: File with the Node.js version to use
        type: string
        default: .nvmrc
      targets:
        description: Comma-separated Nx targets to run
        type: string
        default: lint,typecheck,test,build
      format-check:
        description: Run `prettier --check .` before the Nx targets
        type: boolean
        default: true
      timeout-minutes:
        type: number
        default: 20

permissions:
  contents: read

jobs:
  check:
    name: lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
    env:
      HUSKY: '0'
      NX_NO_CLOUD: 'true'
      NX_DAEMON: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # nx affected needs the history to find the merge base
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ${{ inputs.node-version-file }}
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Check formatting
        if: inputs.format-check
        run: npx --no-install prettier --check .

      - name: Run Nx targets
        env:
          TARGETS: ${{ inputs.targets }}
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          QUEUE_BASE: ${{ github.event.merge_group.base_sha }}
        run: |
          case "$EVENT" in
            pull_request) npx --no-install nx affected --targets="$TARGETS" --base="$PR_BASE" --head=HEAD ;;
            merge_group)  npx --no-install nx affected --targets="$TARGETS" --base="$QUEUE_BASE" --head=HEAD ;;
            *)            npx --no-install nx run-many --targets="$TARGETS" ;;
          esac
