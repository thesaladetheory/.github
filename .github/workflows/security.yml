# Runs the shared security checks on this public repo itself.
name: security

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  security-scan:
    uses: ./.github/workflows/security-scan.yml
    permissions:
      contents: read
    with:
      semgrep-config: p/github-actions
      dependency-review: true # free on public repos
